name: Greet Workflow
on: [push]
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello from GitHub Actions!"
  run-tests:
    runs-on: ubuntu-latest
    needs: say-hello
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: |
          python3 src/app.py
          python3 tests/test_app.py
          echo "All tests passed!"
